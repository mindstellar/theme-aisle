name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 33061:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The tests load core's widget store: the newest stable 7.x release, or develop before 7.0 ships.
      - name: Pick the Shopclass 7 version
        id: core
        run: |
          ref="$(git ls-remote --tags --refs https://github.com/mindstellar/shopclass | awk -F/ '{print $3}' | grep -E '^7\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)"
          echo "ref=${ref:-develop}" >> "$GITHUB_OUTPUT"

      - name: Check out Shopclass
        uses: actions/checkout@v7
        with:
          repository: mindstellar/shopclass
          ref: ${{ steps.core.outputs.ref }}
          path: core

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          extensions: mysqli, gd, mbstring

      - name: Install Shopclass dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --working-dir=core

      - name: Home sections migration
        env:
          OSC_CORE: ${{ github.workspace }}/core/
          DRIFT_DB_PORT: '33061'
        run: php tests/seed-home-sections.php

      - name: Link checks
        run: php tests/safe-url.php

      - name: Script checks
        run: for t in tests/*.test.mjs; do node "$t" || exit 1; done
